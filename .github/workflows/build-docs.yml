name: Build Documentation with Moonwave

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'src/**'
      - 'moonwave.toml'
      - '.github/workflows/build-docs.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Roblox toolchain
        uses: ok-nick/setup-aftman@v0.4.0
        with:
          auth: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Moonwave
        run: |
          cargo install moonwave --locked

      - name: Build documentation
        run: |
          moonwave

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs_moonwave'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
