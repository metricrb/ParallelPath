name: Build Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/build-docs.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install -g @mermaid-js/mermaid-cli markdown

      - name: Build documentation site
        run: |
          mkdir -p build
          cp -r docs/* build/
          cp docs/index.md build/README.md

      - name: Create index.html
        run: |
          cat > build/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>parallel-path - Parallel Luau Pathfinding for Roblox</title>
              <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.2.0/github-markdown.css">
              <style>
                  .markdown-body {
                      max-width: 900px;
                      margin: 0 auto;
                      padding: 20px;
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                  }
                  body {
                      background-color: #fff;
                  }
                  @media (prefers-color-scheme: dark) {
                      body {
                          background-color: #0d1117;
                      }
                  }
                  h1 { border-bottom: 3px solid #0969da; padding-bottom: 10px; }
                  a { color: #0969da; text-decoration: none; }
                  a:hover { text-decoration: underline; }
                  code { background-color: #f6f8fa; padding: 2px 6px; border-radius: 3px; }
                  pre { background-color: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; }
              </style>
          </head>
          <body class="markdown-body">
              <nav style="margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #d0d7de;">
                  <a href="/" style="font-weight: bold; font-size: 18px; margin-right: 20px;">parallel-path</a>
                  <a href="/getting-started.md">Getting Started</a> |
                  <a href="/api-reference.md">API Reference</a> |
                  <a href="/guides/">Guides</a> |
                  <a href="https://github.com/metricrb/parallel-path">GitHub</a>
              </nav>
              <div id="content"></div>
              <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
              <script>
                  async function loadMarkdown() {
                      const path = window.location.pathname;
                      const file = path === '/' ? '/README.md' : path + (path.endsWith('.md') ? '' : '.md');
                      try {
                          const response = await fetch(file);
                          const markdown = await response.text();
                          document.getElementById('content').innerHTML = marked.parse(markdown);
                      } catch (e) {
                          document.getElementById('content').innerHTML = '<h1>404 Not Found</h1><p><a href="/">Back to home</a></p>';
                      }
                  }
                  loadMarkdown();
              </script>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
