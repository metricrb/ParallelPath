name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Roblox toolchain
        uses: ok-nick/setup-aftman@v0.4.0
        with:
          auth: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint with selene
        run: |
          selene src tests
        continue-on-error: true

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Roblox toolchain
        uses: ok-nick/setup-aftman@v0.4.0
        with:
          auth: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Luau CLI
        run: |
          curl -L https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip -o /tmp/luau-ubuntu.zip
          unzip -o /tmp/luau-ubuntu.zip -d /tmp/luau-ubuntu >/dev/null
          chmod +x /tmp/luau-ubuntu/luau
          echo "/tmp/luau-ubuntu" >> "$GITHUB_PATH"

      - name: Type check with luau
        run: |
          luau analyze src tests
        continue-on-error: true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate documentation
        run: |
          # Check that all markdown files are valid without requiring root-owned Ruby gems
          if [ -d docs ]; then
            npx --yes markdownlint-cli docs/*.md docs/guides/*.md || true
          fi

      - name: Check documentation links
        run: |
          # Verify markdown files link to existing files
          for file in docs/*.md docs/guides/*.md; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              # Basic link validation (can be enhanced)
              grep -o '\[.*\](.*\.md)' "$file" || true
            fi
          done

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, docs]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Roblox toolchain
        uses: ok-nick/setup-aftman@v0.4.0
        with:
          auth: ${{ secrets.GITHUB_TOKEN }}

      - name: Build RBXM
        run: |
          mkdir -p build
          cat > build/default.project.json << 'EOF'
          {
            "name": "parallel-path",
            "tree": {
              "$className": "DataModel",
              "ServerScriptService": {
                "$className": "ServerScriptService",
                "parallel-path": {
                  "$path": "../src"
                }
              }
            }
          }
          EOF
          cd build
          rojo build -o ../parallel-path.rbxm

      - name: Upload RBXM artifact
        uses: actions/upload-artifact@v4
        with:
          name: parallel-path-rbxm
          path: parallel-path.rbxm

  summary:
    runs-on: ubuntu-latest
    needs: [lint, type-check, docs, build]
    if: always()
    steps:
      - name: Check build status
        run: |
          echo "✅ CI Pipeline Summary"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Type Check: ${{ needs.type-check.result }}"
          echo "Docs: ${{ needs.docs.result }}"
          echo "Build: ${{ needs.build.result }}"
